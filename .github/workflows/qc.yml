# QC on every push and PR: the JUCE-free part (dsp/ unit tests + the ears suite) on Linux, about 2 minutes.
# The plugins (JUCE, pluginval, auval) are built and tested in build.yml.
name: QC
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-ears:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: 0.13.9
          checksum: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5
      - name: Supply-chain pins
        run: make pins
      - name: Unit tests (dsp, feedback, bbd, reel, filtaer)
        run: make test CMAKE=cmake
      - name: Ears (offline render + measurement)
        run: make ears CMAKE=cmake
